version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: unionai
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: unionai
    volumes:
      - ./infra/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unionai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: ./Dockerfile.core
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://unionai:dev_password@postgres:5432/unionai
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: ./Dockerfile.dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - core

  metrics:
    build:
      context: .
      dockerfile: ./Dockerfile.metrics
    ports:
      - "9090:9090"
    environment:
      CORE_URL: http://core:3000
    depends_on:
      - core

volumes:
  postgres_data:
  qdrant_data:

networks:
  default:
    name: unionai
