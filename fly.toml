app = "unionai-core"
primary_region = "iad"

[env]
NODE_ENV = "production"
SERVICE_CHANNEL = "stable"

[[services]]
internal_port = 3000
protocol = "tcp"
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

  [[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/healthz"
    protocol = "http"

  [[services.http_checks]]
    grace_period = "30s"
    interval = "60s"
    method = "get"
    timeout = "8s"
    path = "/readyz"
    protocol = "http"

[deploy]
strategy = "rolling"

[build]
dockerfile = "Dockerfile.core"

  # GIT_SHA i BUILD_TIME są przekazywane przy deployu przez
  # `fly deploy --build-arg GIT_SHA=$(git rev-parse --short HEAD) --build-arg BUILD_TIME=...`
  # (patrz scripts/deploy.sh / scripts/deploy.ps1). Placeholdery poniżej to wartość
  # domyślna gdy build-arg nie zostanie podany — wtedy app raportuje provenance gap.
  [build.args]
    GIT_SHA = "unknown"
    BUILD_TIME = "unknown"
