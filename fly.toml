app = "unionai-core"
primary_region = "iad"

[env]
NODE_ENV = "production"

[[services]]
internal_port = 3000
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true

  [[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[build]
dockerfile = "Dockerfile.core"
