upstream core_api { server core:3000; }
upstream dashboard { server dashboard:5173; }
server {
  listen 80; server_name localhost;
  location /api { proxy_pass http://core_api; proxy_set_header Host $host; }
  location /metrics { proxy_pass http://core_api; }
  location / { proxy_pass http://dashboard; proxy_set_header Host $host; }
}
