upstream core_api { server core:3000; }
upstream dashboard { server dashboard:5173; }
server {
  listen 80; server_name localhost;
  location /api {
    proxy_pass http://core_api;
    proxy_set_header Host $host;
    # MAJOR-09 (pentest RSpace 2026-05-25): forward real client IP so the app's
    # rate limiter (trust proxy=1) keys on the client, not the nginx address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /metrics {
    proxy_pass http://core_api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
