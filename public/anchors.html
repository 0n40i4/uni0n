<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNIONAI — Podgląd łańcucha kotwic (hash-chain)</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #2d333b;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 14px; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toolbar label { font-size: 14px; color: var(--muted); }
    .toolbar input {
      width: 90px;
      padding: 6px 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    button {
      padding: 7px 14px;
      background: var(--accent);
      color: #0e1116;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .stat { color: var(--muted); font-size: 14px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
    .hash { color: var(--accent); }
    .prev { color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .badge.scope { color: var(--accent); }
    .badge.validated { color: var(--ok); border-color: var(--ok); }
    .badge.pending { color: var(--warn); border-color: var(--warn); }
    .msg { padding: 16px; color: var(--muted); }
    .err { color: var(--err); }
    footer { padding: 16px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>UNIONAI — Łańcuch kotwic pamięci</h1>
    <div class="sub">Publiczny podgląd hash-chain anchorów (scope PUBLIC / FEDERATION). Bez treści, payloadu i danych wrażliwych.</div>
  </header>
  <main>
    <div class="toolbar">
      <label for="limit">Limit:</label>
      <input id="limit" type="number" min="1" max="500" value="100" />
      <button id="refresh" type="button">Odśwież</button>
      <span class="stat" id="stat">Ładowanie…</span>
    </div>
    <div id="container">
      <div class="msg">Ładowanie danych…</div>
    </div>
  </main>
  <footer>
    UNIONAI Core · dane z <code>/api/memory/anchors</code> · zero CDN, zero zewnętrznych zasobów.
  </footer>

  <script>
    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function badgeForStatus(st) {
      var cls = 'pending';
      var v = (st || '').toLowerCase();
      if (v === 'validated' || v === 'valid' || v === 'verified') cls = 'validated';
      return '<span class="badge ' + cls + '">' + escapeHtml(st || '—') + '</span>';
    }

    function render(data) {
      var container = document.getElementById('container');
      var stat = document.getElementById('stat');
      if (data.db_error) {
        stat.innerHTML = '<span class="err">Błąd bazy danych — brak danych.</span>';
        container.innerHTML = '<div class="msg err">Nie udało się pobrać kotwic (db_error).</div>';
        return;
      }
      var anchors = Array.isArray(data.anchors) ? data.anchors : [];
      stat.textContent = 'Liczba kotwic: ' + (data.count !== undefined ? data.count : anchors.length) +
        ' · wygenerowano: ' + (data.generated_at || '—');
      if (anchors.length === 0) {
        container.innerHTML = '<div class="msg">Brak publicznych kotwic do wyświetlenia.</div>';
        return;
      }
      var rows = anchors.map(function (a) {
        return '<tr>' +
          '<td><code>' + escapeHtml(a.id) + '</code></td>' +
          '<td><code class="hash">' + escapeHtml(a.hash || '—') + '</code></td>' +
          '<td><code class="prev">' + escapeHtml(a.prev_hash || '—') + '</code></td>' +
          '<td><span class="badge scope">' + escapeHtml(a.scope || '—') + '</span></td>' +
          '<td>' + badgeForStatus(a.validation_status) + '</td>' +
          '<td>' + escapeHtml(a.created_at || '—') + '</td>' +
          '</tr>';
      }).join('');
      container.innerHTML =
        '<table><thead><tr>' +
        '<th>ID kotwicy</th><th>Hash (semantyczny)</th><th>Hash poprz. (delta)</th>' +
        '<th>Zakres</th><th>Walidacja</th><th>Utworzono</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function load() {
      var stat = document.getElementById('stat');
      stat.textContent = 'Ładowanie…';
      var limit = parseInt(document.getElementById('limit').value, 10) || 100;
      fetch('/api/memory/anchors?limit=' + encodeURIComponent(limit))
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function (e) {
          stat.innerHTML = '<span class="err">Błąd sieci.</span>';
          document.getElementById('container').innerHTML =
            '<div class="msg err">Nie udało się pobrać danych: ' + escapeHtml(e.message) + '</div>';
        });
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
