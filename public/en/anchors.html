<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNIONAI — Memory Anchor Hash-Chain</title>
  <link rel="canonical" href="https://uni0nai.k0nsult.cloud/en/anchors">
  <link rel="alternate" hreflang="pl" href="https://uni0nai.k0nsult.cloud/anchors">
  <link rel="alternate" hreflang="en" href="https://uni0nai.k0nsult.cloud/en/anchors">
  <link rel="alternate" hreflang="x-default" href="https://uni0nai.k0nsult.cloud/anchors">
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #2d333b;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 14px; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toolbar label { font-size: 14px; color: var(--muted); }
    .toolbar input {
      width: 90px;
      padding: 6px 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    button {
      padding: 7px 14px;
      background: var(--accent);
      color: #0e1116;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .stat { color: var(--muted); font-size: 14px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
    .hash { color: var(--accent); }
    .prev { color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .badge.scope { color: var(--accent); }
    .badge.validated { color: var(--ok); border-color: var(--ok); }
    .badge.pending { color: var(--warn); border-color: var(--warn); }
    .msg { padding: 16px; color: var(--muted); }
    .err { color: var(--err); }
    footer { padding: 16px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
    .lang-sw { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .lang-sw a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>UNIONAI — Memory Anchor Hash-Chain</h1>
    <div class="sub">Public view of hash-chain anchors (scope PUBLIC / FEDERATION). No content, payload or sensitive data exposed.</div>
    <div class="lang-sw"><a href="/anchors">Polski (PL)</a> | <strong>English (EN)</strong></div>
  </header>
  <main>
    <div class="toolbar">
      <label for="limit">Limit:</label>
      <input id="limit" type="number" min="1" max="500" value="100" />
      <button id="refresh" type="button">Refresh</button>
      <span class="stat" id="stat">Loading…</span>
    </div>
    <div id="container">
      <div class="msg">Loading data…</div>
    </div>
  </main>
  <footer>
    UNIONAI Core · data from <code>/api/memory/anchors</code> · zero CDN, zero external resources.
  </footer>

  <script src="/js/anchors.js"></script>
</body>
</html>
