<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="UNIONAI Federation Flag">
  <title>UNIONAI Federation Flag</title>
  <!-- Background: deep space blue -->
  <rect width="900" height="600" fill="#0d1117"/>
  <!-- Horizontal accent stripe — amber (governance) -->
  <rect y="540" width="900" height="60" fill="#d29922"/>
  <!-- Thin top stripe — green (network health) -->
  <rect y="0" width="900" height="18" fill="#3fb950"/>
  <!-- Central hexagonal emblem group -->
  <!-- Outer hex ring -->
  <polygon points="450,120 540,170 540,270 450,320 360,270 360,170"
           fill="none" stroke="#58a6ff" stroke-width="4" opacity="0.8"/>
  <!-- Inner hex fill -->
  <polygon points="450,145 522,186 522,254 450,295 378,254 378,186"
           fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <!-- Central Ω symbol (union/infinity) -->
  <text x="450" y="248" text-anchor="middle" font-family="Georgia,serif"
        font-size="72" font-weight="700" fill="#58a6ff" opacity="0.95">Ω</text>
  <!-- Node dots at hex vertices — represent federated agents -->
  <circle cx="450" cy="120" r="7" fill="#3fb950"/>
  <circle cx="540" cy="170" r="7" fill="#58a6ff"/>
  <circle cx="540" cy="270" r="7" fill="#58a6ff"/>
  <circle cx="450" cy="320" r="7" fill="#3fb950"/>
  <circle cx="360" cy="270" r="7" fill="#58a6ff"/>
  <circle cx="360" cy="170" r="7" fill="#58a6ff"/>
  <!-- Connecting lines (mesh network motif) -->
  <line x1="450" y1="120" x2="540" y2="270" stroke="#58a6ff" stroke-width="1" opacity="0.25"/>
  <line x1="540" y1="170" x2="360" y2="270" stroke="#58a6ff" stroke-width="1" opacity="0.25"/>
  <line x1="540" y1="270" x2="360" y2="170" stroke="#58a6ff" stroke-width="1" opacity="0.25"/>
  <line x1="450" y1="120" x2="450" y2="320" stroke="#3fb950" stroke-width="1" opacity="0.2"/>
  <!-- Federation name -->
  <text x="450" y="400" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="36" font-weight="700" letter-spacing="8" fill="#e6edf3">UNIONAI</text>
  <!-- Tagline -->
  <text x="450" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="16" letter-spacing="3" fill="#8b949e">INTERNET OF AGENTS · FEDERACJA</text>
  <!-- Bottom motto strip text -->
  <text x="450" y="582" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="16" font-weight="700" letter-spacing="2" fill="#0d1117">CLAIM ≤ PROOF · GO CONTROLLED</text>
</svg>
