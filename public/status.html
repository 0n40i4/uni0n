<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Status systemu — UNIONAI</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --ok: #3fb950;
    --warn: #d29922;
    --fail: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }
  .big { font-size: 28px; font-weight: 700; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .pill.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .row .k { color: var(--muted); }
  .row .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; text-align: right; }
  .checks li { list-style: none; display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .checks { padding: 0; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--fail); }
  footer { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
  a { color: var(--accent); }
  .err { color: var(--fail); }
</style>
</head>
<body>
<header>
  <h1>Status systemu UNIONAI</h1>
  <div class="sub">Federacja agentów — podgląd na żywo. Odświeżanie co 30 s.</div>
</header>
<main>
  <div class="grid" id="cards">
    <div class="card"><h2>Ładowanie…</h2><div class="sub">Pobieranie danych statusu.</div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Test dymny (smoke)</h2>
    <div id="smoke"><div class="sub">Ładowanie…</div></div>
  </div>
</main>
<footer>
  Strona statusu nie wymaga logowania. Źródła: <code>/api/status</code> i <code>/api/system/smoke</code>.
</footer>

<script src="/js/status.js"></script>
</body>
</html>
